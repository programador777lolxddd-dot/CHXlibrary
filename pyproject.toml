[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chxlibrary"
version = "0.1.0"
description = "Utilidades prácticas para Python: texto, números, fechas, archivos y funciones creativas."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "programador777lolxddd-dot" },
]
keywords = ["python", "utilidades", "strings", "números", "fechas", "archivos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/programador777lolxddd-dot/CHXlibrary"
Repository = "https://github.com/programador777lolxddd-dot/CHXlibrary"
Issues = "https://github.com/programador777lolxddd-dot/CHXlibrary/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0", "ruff>=0.4"]

[project.scripts]
chrotrixurum = "chrotrixurum:main"

[tool.setuptools]
py-modules = ["chrotrixurum"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
